<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Someone Special ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>My Heart's Equation</h1>
        </header>
        
        <div class="heart-container">
            <canvas id="heartCanvas"></canvas>
            <div class="equation">
                \[ y = |x|^{\frac{2}{3}} + 0.9 \sin(kx) \sqrt{3 - x^2} \]
                \[ k = 4.11 \]
            </div>
        </div>
        
        <div class="message">
            <p>Every point on this graph represents a moment I've thought of you.</p>
            <p>The equation may be complex, but my feelings are simple...</p>
            <h2>I love you</h2>
            <p>Will you go on a date with me?</p>
        </div>
        
        <div class="buttons">
            <button id="yesBtn">YES! ❤️</button>
            <button id="noBtn">No</button>
        </div>
        
        <footer>
            <p>Created with love by <span class="signature">Achieve</span></p>
        </footer>
    </div>
    
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="heart.js"></script>
    <script src="script.js"></script>
</body>
</html>
